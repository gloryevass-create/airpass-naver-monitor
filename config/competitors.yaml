# 모니터링 대상 블로그 (수동 등록) — 경쟁사 5곳 + 에어패스 자체 블로그(비교 기준용).
# "경쟁사" 테이블(Supabase competitors)에 함께 등록되지만, 대시보드 UI에서는 "경쟁사"라는
# 표현을 쓰지 않고 중립적으로 "블로그"라 부른다(에어패스 자신도 포함되므로).
#
# domain: 파워링크 노출 도메인 매칭에 쓰인다(A4 도메인→경쟁사 매핑의 1차 근거).
#         corporate 도메인이 아니라 blog.naver.com처럼 여러 주체가 공유하는 도메인이면
#         false-positive 매칭이 생기므로 비워둔다(투데이스쿨 참고).
# blog_id: 네이버 블로그 URL의 blog.naver.com/<blog_id>에서 추출. 없으면 Track B(블로그
#          SOV·포스팅 주기) 집계에서 제외된다(플레이디딤 참고 — 확인되면 채울 것).
competitors:
  - name: "이엔씨아이티"
    domain: "encit.co.kr"
    blog_id: "encit"
  - name: "위즈업"
    domain: "whizzup.co.kr"
    blog_id: "whizzup"
  - name: "뉴로플레이랩"
    domain: "neuroplay.co.kr"
    blog_id: "neuroplay"
  - name: "투데이스쿨"
    domain: null
    blog_id: "carasystem"
  - name: "플레이디딤"
    domain: "play-didim.com"
    blog_id: null
  - name: "에어패스"
    domain: "airpass.co.kr"
    blog_id: "airpass-blog"
